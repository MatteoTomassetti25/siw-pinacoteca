<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inserisci Nuova Area</title>
    <link rel="icon" href="/images/icons8-pennello-32.png" type="image/png" sizes="40x40">
    <style>
        body {
            background-color: #f0f0f0;
            background-image: url("https://www.uniroma3.it/assets/img/uniroma3_logo.png");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .container {
            background-color: #ffffff;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            max-width: 900px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 32px;
            margin: 30px 0;
            color: #333;
        }
        /* Stili per il form */
        .form-label {
            display: block;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        .form-control {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        /* Stile per i messaggi di errore */
        .alert {
            color: red;
            font-size: 16px;
            margin-top: -10px;
            margin-bottom: 20px;
            padding: 10px;
            font-weight: bold;
        }
        /* Stile per i pulsanti */
        .btn-container {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-top: 20px;
        }
        .btn {
            background-color: #D32F2F;
            color: white;
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
            flex: 1; /* Rende i pulsanti della stessa larghezza */
        }
        .btn:hover {
            background-color: #B22222;
        }
        .btn-primary {
            background-color: #808080;
        }
        .btn-primary:hover {
            background-color: #555555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Inserisci una nuova Area</h1>
        <form th:action="@{/admin/salvaArea}" th:object="${area}" method="post">
            <!-- Messaggio di errore generale -->
            <div th:if="${messaggioErrore}" class="alert" th:text="${messaggioErrore}"></div>

            <!-- Campo Nome -->
            <div>
                <label for="nome" class="form-label">Nome dell'area:</label>
                <input type="text" id="nome" th:field="*{nome}" class="form-control">
                <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="alert">Errore nel nome</span>
            </div>

            <!-- Pulsanti Salva e Torna -->
            <div class="btn-container">
                <button type="submit" class="btn">Salva Area</button>
                <a href="/admin/operazioniAree" class="btn btn-primary">Torna al Menu</a>
            </div>
        </form>
    </div>
</body>
</html>
