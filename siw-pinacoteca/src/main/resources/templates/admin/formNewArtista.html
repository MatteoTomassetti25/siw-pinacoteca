<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inserimento Artista</title>
	<link rel="icon" href="/images/icons8-pennello-32.png" type="image/png" sizes="40x40">
    <style>
        body {
            background-color: #f0f0f0;
            background-image: url("https://www.uniroma3.it/assets/img/uniroma3_logo.png");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .container {
            background-color: #ffffff;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            max-width: 900px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 32px;
            margin: 30px 0;
            color: #333;
        }
        /* Messaggi di conferma/errore */
        .message {
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
        }
        .message.success {
            color: green;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
        }
        .message.error {
            color: red;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
        }
        /* Form */
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .form-group {
            width: 100%;
            text-align: left;
        }
        .form-group label {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 10px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
            background-color: #fff;
            transition: border-color 0.3s ease;
        }
        .form-group input:focus {
            border-color: #D32F2F;
            outline: none;
        }
        button {
            background-color: #D32F2F;
            color: white;
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        button:hover {
            background-color: #B22222;
        }
        /* Link */
        .btn-back {
            display: inline-block;
            background-color: #D32F2F;
            color: white;
            padding: 14px 28px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            transition: background 0.3s ease;
        }
        .btn-back:hover {
            background-color: #B22222;
        }
		
		/* Stile per i messaggi di errore */
		.field-error {
		    color: red; /* Testo rosso */
		    font-size: 14px;
		    margin-top: 5px;
		}
    </style>
</head>
<body>
    <div class="container">
        <h1>Inserisci un nuovo Artista</h1>
        <!-- Messaggi di conferma o errore -->
        <div th:if="${messaggio}" class="message success" th:text="${messaggio}"></div>
        <form th:action="@{/admin/salvaArtista}" method="post" th:object="${artista}">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" th:field="*{nome}"  minlength="2" maxlength="50"/>
				<div th:if="${#fields.hasErrors('nome')}" class="field-error" th:errors="*{nome}"></div>
            </div>
            <div class="form-group">
                <label for="cognome">Cognome:</label>
                <input type="text" id="cognome" name="cognome" th:field="*{cognome}" minlength="2" maxlength="50"/>
				<div th:if="${#fields.hasErrors('cognome')}" class="field-error" th:errors="*{cognome}"></div>
            </div>
            <div class="form-group">
                <label for="dataNascita">Data di Nascita:</label>
                <input type="date" id="dataNascita" name="dataNascita" th:field="*{dataNascita}" />
				<div th:if="${#fields.hasErrors('dataNascita')}" class="field-error" th:errors="*{dataNascita}"></div>
            </div>
            <div class="form-group">
                <label for="luogoNascita">Luogo di Nascita:</label>
                <input type="text" id="luogoNascita" name="luogoNascita" th:field="*{luogoNascita}"/>
				<div th:if="${#fields.hasErrors('luogoNascita')}" class="field-error" th:errors="*{luogoNascita}"></div>
            </div>
            <div class="form-group">
                <label for="dataMorte">Data di Morte (opzionale):</label>
                <input type="date" id="dataMorte" name="dataMorte" th:field="*{dataMorte}"/>
				<div th:if="${#fields.hasErrors('dataMorte')}" class="field-error" th:errors="*{dataMorte}"></div>
            </div>
            <button type="submit">Salva Artista</button>
        </form>
        <br>
        <a th:href="@{/admin/operazioniArtista}" class="btn-back">Torna alle operazioni sugli artisti</a>
    </div>
</body>
</html>
