<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Aree</title>
    <link rel="icon" href="/images/icons8-pennello-32.png" type="image/png" sizes="40x40">
    <style>
       body {
           background-color: #f0f0f0;
           background-size: cover;
           background-position: center;
           display: flex;
           flex-direction: column;
           justify-content: center;
           align-items: center;
           min-height: 100vh;
           margin: 0;
           font-family: Arial, sans-serif;
           padding: 20px;
       }
       .container {
           background-color: #ffffff;
           padding: 50px;
           border-radius: 15px;
           box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
           max-width: 800px;
           width: 90%;
           text-align: center;
           margin-bottom: 30px;
       }
       h1 {
           font-size: 32px;
           margin-bottom: 30px;
           color: #333;
       }
       table {
           width: 100%;
           border-collapse: collapse;
           margin-top: 20px;
           background-color: #fff;
           border-radius: 10px;
           overflow: hidden;
           box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
       }
       th, td {
           padding: 12px;
           text-align: left;
           border-bottom: 1px solid #ddd;
       }
       th {
           background-color: #D32F2F;
           font-weight: bold;
           color: white;
       }
       tr:hover {
           background-color: #f1f1f1;
       }
       .message {
           padding: 10px;
           margin-bottom: 20px;
           border-radius: 5px;
       }
       .success {
           background-color: #d4edda;
           color: #155724;
       }
       .error {
           background-color: #f8d7da;
           color: #721c24;
       }
       .btn {
           background-color: #D32F2F;
           color: white;
           padding: 12px 25px;
           border-radius: 8px;
           text-decoration: none;
           font-size: 16px;
           font-weight: bold;
           margin: 5px;
           display: inline-block;
           transition: background 0.3s ease;
           border: none;
           cursor: pointer;
       }
       .btn:hover {
           background-color: #B22222;
       }
       .action-btn {
           padding: 8px 15px;
           border-radius: 5px;
           text-decoration: none;
           color: white;
           font-weight: bold;
           transition: background 0.3s ease;
       }
       .action-btn.modifica {
           background-color: #FF8C00;
       }
       .action-btn.modifica:hover {
           background-color: #E67E22;
       }
       .delete {
           background-color: #dc3545;
       }
       .delete:hover {
           background-color: #a71d2a;
       }
       .text-center {
           text-align: center;
       }
       .mt-4 {
           margin-top: 20px;
       }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lista delle Aree</h1>
        <div th:if="${messaggioConferma}" class="message success" th:text="${messaggioConferma}"></div>
        <div th:if="${messaggioErrore}" class="message error" th:text="${messaggioErrore}"></div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Curatore</th>
                    <th>Azioni</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="area : ${aree}">
                    <td th:text="${area.id}"></td>
                    <td th:text="${area.nome}"></td>
                    <td th:text="${area.curatore != null ? area.curatore.nome + ' ' + area.curatore.cognome : 'Nessun curatore'}"></td>
                    <td>
                        <a th:href="@{/admin/modificaArea/{id}(id=${area.id})}" class="action-btn modifica">Modifica</a>
                        <a th:href="@{/admin/eliminaArea/{id}(id=${area.id})}" class="action-btn delete" onclick="return confirm('Sei sicuro di voler eliminare questa area?');">Elimina</a>
                    </td>
                </tr>
            </tbody>
        </table>
        <div class="text-center mt-4">
            <a th:href="@{/admin/operazioniAree}" class="btn">Torna alle operazioni sulle aree</a>
        </div>
    </div>
</body>
</html>
